[platformio]
; Select the environment matching the inspected module crystal explicitly.
core_dir = ../../.tools/platformio

[env]
platform = atmelavr@5.1.0
board = megaatmega2560
framework = arduino
platform_packages =
    platformio/toolchain-atmelavr@1.70300.191015
    platformio/framework-arduino-avr@5.2.0
    platformio/tool-scons@4.40801.0
    platformio/tool-avrdude@1.60300.200527
monitor_speed = 115200
lib_deps = https://github.com/autowp/arduino-mcp2515.git#49e0d7d6755bab09cc3e68997bfdb75264c8daf7

[env:loopback_8mhz]
build_src_filter = +<main.cpp>
build_flags = -DOPENMOTO_MCP_CLOCK_MHZ=8

[env:loopback_16mhz]
build_src_filter = +<main.cpp>
build_flags = -DOPENMOTO_MCP_CLOCK_MHZ=16

[env:loopback_20mhz]
build_src_filter = +<main.cpp>
build_flags = -DOPENMOTO_MCP_CLOCK_MHZ=20

; Dual-module physical CAN suite. Separate from Phase 1.
[env:physical_dual_8mhz]
build_src_filter = +<phase2/*.cpp>
build_flags = -DOPENMOTO_MCP_CLOCK_MHZ=8

; Phase 3A: CAN1 LISTEN_ONLY sniffer. CAN2 held silent in CONFIG. Separate from
; Phase 1/2. The 256-byte core serial TX buffer lets frame lines queue without
; blocking reception; see docs/phase3a.md.
[env:sniffer_8mhz]
build_src_filter = +<phase3a/*.cpp>
build_flags = -DOPENMOTO_MCP_CLOCK_MHZ=8 -DSERIAL_TX_BUFFER_SIZE=256 -DOPENMOTO_SNIFFER_BENCH=0

; Phase 3A bench variant: same sniffer plus the BENCH command, in which CAN2
; (NORMAL mode) sends deterministic test traffic. CAN1 remains LISTEN_ONLY.
[env:sniffer_bench_8mhz]
build_src_filter = +<phase3a/*.cpp>
build_flags = -DOPENMOTO_MCP_CLOCK_MHZ=8 -DSERIAL_TX_BUFFER_SIZE=256 -DOPENMOTO_SNIFFER_BENCH=1

; ---------------------------------------------------------------------------
; Phase 3B: high-performance CAN1 LISTEN_ONLY sniffer (src/phase3b/). Separate
; from Phase 1/2/3A. SPI clock and baud are fixed per environment so every
; benchmark result maps to one reproducible binary. See docs/phase3b.md.
[p3b_base]
build_src_filter = +<phase3b/*.cpp>
build_flags = -DOPENMOTO_MCP_CLOCK_MHZ=8 -DSERIAL_TX_BUFFER_SIZE=256 -DOPENMOTO_QUEUE_SIZE=64

; SPI sweep (bench variant: CAN2 traffic commands available), 921600 nominal baud.
[env:p3b_bench_spi1_921k]
extends = p3b_base
build_flags = ${p3b_base.build_flags} -DOPENMOTO_SNIFFER_BENCH=1 -DOPENMOTO_SPI_HZ=1000000 -DOPENMOTO_SNIFFER_BAUD=921600

[env:p3b_bench_spi4_921k]
extends = p3b_base
build_flags = ${p3b_base.build_flags} -DOPENMOTO_SNIFFER_BENCH=1 -DOPENMOTO_SPI_HZ=4000000 -DOPENMOTO_SNIFFER_BAUD=921600

[env:p3b_bench_spi8_921k]
extends = p3b_base
build_flags = ${p3b_base.build_flags} -DOPENMOTO_SNIFFER_BENCH=1 -DOPENMOTO_SPI_HZ=8000000 -DOPENMOTO_SNIFFER_BAUD=921600

; Baud sweep at the selected 4 MHz SPI clock, plus a 1 MHz SPI provocation run at
; 460800 (1 MHz SPI produces the bursty output that lost bytes at 921600).
[env:p3b_bench_spi4_460k]
extends = p3b_base
build_flags = ${p3b_base.build_flags} -DOPENMOTO_SNIFFER_BENCH=1 -DOPENMOTO_SPI_HZ=4000000 -DOPENMOTO_SNIFFER_BAUD=460800

[env:p3b_bench_spi4_115k]
extends = p3b_base
build_flags = ${p3b_base.build_flags} -DOPENMOTO_SNIFFER_BENCH=1 -DOPENMOTO_SPI_HZ=4000000 -DOPENMOTO_SNIFFER_BAUD=115200

[env:p3b_bench_spi1_460k]
extends = p3b_base
build_flags = ${p3b_base.build_flags} -DOPENMOTO_SNIFFER_BENCH=1 -DOPENMOTO_SPI_HZ=1000000 -DOPENMOTO_SNIFFER_BAUD=460800

; Output pacing experiment (16U2 bridge byte loss under sustained bursts).
[env:p3b_bench_spi4_921k_pace20k]
extends = p3b_base
build_flags = ${p3b_base.build_flags} -DOPENMOTO_SNIFFER_BENCH=1 -DOPENMOTO_SPI_HZ=4000000 -DOPENMOTO_SNIFFER_BAUD=921600 -DOPENMOTO_TX_PACE_BPS=20000

[env:p3b_bench_spi4_460k_pace20k]
extends = p3b_base
build_flags = ${p3b_base.build_flags} -DOPENMOTO_SNIFFER_BENCH=1 -DOPENMOTO_SPI_HZ=4000000 -DOPENMOTO_SNIFFER_BAUD=460800 -DOPENMOTO_TX_PACE_BPS=20000

[env:p3b_bench_spi4_921k_pace35k]
extends = p3b_base
build_flags = ${p3b_base.build_flags} -DOPENMOTO_SNIFFER_BENCH=1 -DOPENMOTO_SPI_HZ=4000000 -DOPENMOTO_SNIFFER_BAUD=921600 -DOPENMOTO_TX_PACE_BPS=35000

; Phase 3B production sniffer (no CAN2 transmit code): 4 MHz SPI, 921600 nominal
; baud (1,000,000 actual), binary output paced to 20 kB/s - the verified
; transport-loss-free setting on this bench (docs/phase3b.md).
[env:p3b_sniffer]
extends = p3b_base
build_flags = ${p3b_base.build_flags} -DOPENMOTO_SNIFFER_BENCH=0 -DOPENMOTO_SPI_HZ=4000000 -DOPENMOTO_SNIFFER_BAUD=921600 -DOPENMOTO_TX_PACE_BPS=20000

; ---------------------------------------------------------------------------
; Phase 4: READ-ONLY active diagnostics (src/diag/). Separate from Phase 1/2/3A/3B;
; p3b_sniffer is unchanged. Nothing here is authorized for use on a vehicle until
; the prerequisites in docs/diag-active.md are met. See that document first.
[diag_base]
build_src_filter = +<diag/*.cpp>
build_flags = -DOPENMOTO_MCP_CLOCK_MHZ=8 -DOPENMOTO_SPI_HZ=1000000

; No transmit code compiled in: ARM works, CONFIRM reports DRYRUN. Audited by
; tests/check_diag_firmware.py (no NORMAL mode request, no TX routine linked).
[env:diag_dryrun]
extends = diag_base
build_flags = ${diag_base.build_flags} -DOPENMOTO_DIAG_ALLOW_TX=0

; Transmit path compiled in (one-shot NORMAL mode, ARM/CONFIRM gated, allowlisted
; read-only requests). BUILD ONLY: not uploaded or used on any bus in this task.
[env:diag_readonly]
extends = diag_base
build_flags = ${diag_base.build_flags} -DOPENMOTO_DIAG_ALLOW_TX=1

; ---------------------------------------------------------------------------
; Phase 5: first real KOMBI read-only probe (22 F1 50). Same read-only core, plus
; exactly one extra allowlisted DID (0xF150) for the BMW KOMBI identification
; read; still no write/reset/session/security/routine. See docs/diag-kombi-probe.md.
;
; Dry-run probe: ARM/CONFIRM the probe with NO transmit code (rehearsal/bench).
[env:diag_kombi_probe_dryrun]
extends = diag_base
build_flags = ${diag_base.build_flags} -DOPENMOTO_DIAG_ALLOW_TX=0 -DOPENMOTO_DIAG_KOMBI_PROBE=1

; Transmit-capable probe build. BUILD ONLY in this phase: not uploaded or used on
; any bus until the GO prerequisites in docs/diag-kombi-probe.md are met.
[env:diag_kombi_probe]
extends = diag_base
build_flags = ${diag_base.build_flags} -DOPENMOTO_DIAG_ALLOW_TX=1 -DOPENMOTO_DIAG_KOMBI_PROBE=1

; ---------------------------------------------------------------------------
; Phase 7: read-only KOMBI service inspection. Same read-only core, plus exactly
; four extra allowlisted service DIDs (E119/E12B/E12C/E12D); still no write/
; reset/session/security/routine/coding. See docs/diag-kombi-service-read.md.
; Separate flag from the Phase 5 probe: the F150 probe build is unaffected.
;
; Dry-run: ARM/CONFIRM the service reads with NO transmit code (rehearsal).
[env:diag_service_read_dryrun]
extends = diag_base
build_flags = ${diag_base.build_flags} -DOPENMOTO_DIAG_ALLOW_TX=0 -DOPENMOTO_DIAG_SERVICE_READ=1

; Transmit-capable service-read build. Deploy only after the Phase 5/6 link + probe
; are confirmed and with the supervised per-request procedure in the doc.
[env:diag_service_read]
extends = diag_base
build_flags = ${diag_base.build_flags} -DOPENMOTO_DIAG_ALLOW_TX=1 -DOPENMOTO_DIAG_SERVICE_READ=1

; ---------------------------------------------------------------------------
; Phase 6: ACK-ONLY CAN bring-up (src/diag_ack/). Separate source tree from
; Phase 3B/4/5; those are unchanged. Starts in LISTEN_ONLY and never auto-enters
; NORMAL. Entering ACK-only (NORMAL, no TX) is ACTIVE bus participation (hardware
; ACK + error frames) and requires ARM + CONFIRM. There is NO transmit path in
; this firmware. See docs/diag-ack-bringup.md before any vehicle use.
[env:diag_ack]
build_src_filter = +<diag_ack/*.cpp>
build_flags = -DOPENMOTO_MCP_CLOCK_MHZ=8 -DOPENMOTO_SPI_HZ=1000000

; ---------------------------------------------------------------------------
; Phase 9: KOMBI service-reminder WRITE (src/diag_write/). SEPARATE source tree
; and core (write_core.h) so the read-only diag builds stay byte-identical. Adds
; ISO-TP multi-frame transmit + read-back verify. Only 2E E1 2B/2C/2D are armable.
; Writes mutate cluster NVM -- see docs/diag-kombi-service-reset.md. Deploy only
; after offline tests pass and with the supervised per-write procedure.
[diag_write_base]
build_src_filter = +<diag_write/*.cpp>
build_flags = -DOPENMOTO_MCP_CLOCK_MHZ=8 -DOPENMOTO_SPI_HZ=1000000

; Dry-run: ARM/CONFIRM reach a write but NO transmit code is compiled in.
[env:diag_write_dryrun]
extends = diag_write_base
build_flags = ${diag_write_base.build_flags} -DOPENMOTO_WRITE_ALLOW_TX=0

; Transmit-capable write build. BUILD + bench/offline only until the owner
; authorizes the real write with chosen values.
[env:diag_write]
extends = diag_write_base
build_flags = ${diag_write_base.build_flags} -DOPENMOTO_WRITE_ALLOW_TX=1
