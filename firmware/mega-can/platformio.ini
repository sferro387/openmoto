[platformio]
; Select the environment matching the inspected module crystal explicitly.
core_dir = ../../.tools/platformio

[env]
platform = atmelavr@5.1.0
board = megaatmega2560
framework = arduino
platform_packages =
    platformio/toolchain-atmelavr@1.70300.191015
    platformio/framework-arduino-avr@5.2.0
    platformio/tool-scons@4.40801.0
    platformio/tool-avrdude@1.60300.200527
monitor_speed = 115200
lib_deps = https://github.com/autowp/arduino-mcp2515.git#49e0d7d6755bab09cc3e68997bfdb75264c8daf7

[env:loopback_8mhz]
build_src_filter = +<main.cpp>
build_flags = -DOPENMOTO_MCP_CLOCK_MHZ=8

[env:loopback_16mhz]
build_src_filter = +<main.cpp>
build_flags = -DOPENMOTO_MCP_CLOCK_MHZ=16

[env:loopback_20mhz]
build_src_filter = +<main.cpp>
build_flags = -DOPENMOTO_MCP_CLOCK_MHZ=20

; Hardware confirmation is required before upload. Separate from Phase 1.
[env:physical_dual_8mhz]
build_src_filter = +<phase2/*.cpp>
build_flags = -DOPENMOTO_MCP_CLOCK_MHZ=8
