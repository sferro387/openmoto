[platformio]
; Select the environment matching the inspected module crystal explicitly.
core_dir = ../../.tools/platformio

[env]
platform = atmelavr@5.1.0
board = megaatmega2560
framework = arduino
platform_packages =
    platformio/toolchain-atmelavr@1.70300.191015
    platformio/framework-arduino-avr@5.2.0
    platformio/tool-scons@4.40801.0
    platformio/tool-avrdude@1.60300.200527
monitor_speed = 115200
lib_deps = https://github.com/autowp/arduino-mcp2515.git#49e0d7d6755bab09cc3e68997bfdb75264c8daf7

[env:loopback_8mhz]
build_src_filter = +<main.cpp>
build_flags = -DOPENMOTO_MCP_CLOCK_MHZ=8

[env:loopback_16mhz]
build_src_filter = +<main.cpp>
build_flags = -DOPENMOTO_MCP_CLOCK_MHZ=16

[env:loopback_20mhz]
build_src_filter = +<main.cpp>
build_flags = -DOPENMOTO_MCP_CLOCK_MHZ=20

; Dual-module physical CAN suite. Separate from Phase 1.
[env:physical_dual_8mhz]
build_src_filter = +<phase2/*.cpp>
build_flags = -DOPENMOTO_MCP_CLOCK_MHZ=8

; Phase 3A: CAN1 LISTEN_ONLY sniffer. CAN2 held silent in CONFIG. Separate from
; Phase 1/2. The 256-byte core serial TX buffer lets frame lines queue without
; blocking reception; see docs/phase3a.md.
[env:sniffer_8mhz]
build_src_filter = +<phase3a/*.cpp>
build_flags = -DOPENMOTO_MCP_CLOCK_MHZ=8 -DSERIAL_TX_BUFFER_SIZE=256 -DOPENMOTO_SNIFFER_BENCH=0

; Phase 3A bench variant: same sniffer plus the BENCH command, in which CAN2
; (NORMAL mode) sends deterministic test traffic. CAN1 remains LISTEN_ONLY.
[env:sniffer_bench_8mhz]
build_src_filter = +<phase3a/*.cpp>
build_flags = -DOPENMOTO_MCP_CLOCK_MHZ=8 -DSERIAL_TX_BUFFER_SIZE=256 -DOPENMOTO_SNIFFER_BENCH=1

; ---------------------------------------------------------------------------
; Phase 3B: high-performance CAN1 LISTEN_ONLY sniffer (src/phase3b/). Separate
; from Phase 1/2/3A. SPI clock and baud are fixed per environment so every
; benchmark result maps to one reproducible binary. See docs/phase3b.md.
[p3b_base]
build_src_filter = +<phase3b/*.cpp>
build_flags = -DOPENMOTO_MCP_CLOCK_MHZ=8 -DSERIAL_TX_BUFFER_SIZE=256 -DOPENMOTO_QUEUE_SIZE=64

; SPI sweep (bench variant: CAN2 traffic commands available), 921600 nominal baud.
[env:p3b_bench_spi1_921k]
extends = p3b_base
build_flags = ${p3b_base.build_flags} -DOPENMOTO_SNIFFER_BENCH=1 -DOPENMOTO_SPI_HZ=1000000 -DOPENMOTO_SNIFFER_BAUD=921600

[env:p3b_bench_spi4_921k]
extends = p3b_base
build_flags = ${p3b_base.build_flags} -DOPENMOTO_SNIFFER_BENCH=1 -DOPENMOTO_SPI_HZ=4000000 -DOPENMOTO_SNIFFER_BAUD=921600

[env:p3b_bench_spi8_921k]
extends = p3b_base
build_flags = ${p3b_base.build_flags} -DOPENMOTO_SNIFFER_BENCH=1 -DOPENMOTO_SPI_HZ=8000000 -DOPENMOTO_SNIFFER_BAUD=921600

; Baud sweep at the selected 4 MHz SPI clock, plus a 1 MHz SPI provocation run at
; 460800 (1 MHz SPI produces the bursty output that lost bytes at 921600).
[env:p3b_bench_spi4_460k]
extends = p3b_base
build_flags = ${p3b_base.build_flags} -DOPENMOTO_SNIFFER_BENCH=1 -DOPENMOTO_SPI_HZ=4000000 -DOPENMOTO_SNIFFER_BAUD=460800

[env:p3b_bench_spi4_115k]
extends = p3b_base
build_flags = ${p3b_base.build_flags} -DOPENMOTO_SNIFFER_BENCH=1 -DOPENMOTO_SPI_HZ=4000000 -DOPENMOTO_SNIFFER_BAUD=115200

[env:p3b_bench_spi1_460k]
extends = p3b_base
build_flags = ${p3b_base.build_flags} -DOPENMOTO_SNIFFER_BENCH=1 -DOPENMOTO_SPI_HZ=1000000 -DOPENMOTO_SNIFFER_BAUD=460800

; Output pacing experiment (16U2 bridge byte loss under sustained bursts).
[env:p3b_bench_spi4_921k_pace20k]
extends = p3b_base
build_flags = ${p3b_base.build_flags} -DOPENMOTO_SNIFFER_BENCH=1 -DOPENMOTO_SPI_HZ=4000000 -DOPENMOTO_SNIFFER_BAUD=921600 -DOPENMOTO_TX_PACE_BPS=20000

[env:p3b_bench_spi4_460k_pace20k]
extends = p3b_base
build_flags = ${p3b_base.build_flags} -DOPENMOTO_SNIFFER_BENCH=1 -DOPENMOTO_SPI_HZ=4000000 -DOPENMOTO_SNIFFER_BAUD=460800 -DOPENMOTO_TX_PACE_BPS=20000

[env:p3b_bench_spi4_921k_pace35k]
extends = p3b_base
build_flags = ${p3b_base.build_flags} -DOPENMOTO_SNIFFER_BENCH=1 -DOPENMOTO_SPI_HZ=4000000 -DOPENMOTO_SNIFFER_BAUD=921600 -DOPENMOTO_TX_PACE_BPS=35000

; Phase 3B production sniffer (no CAN2 transmit code): 4 MHz SPI, 921600 nominal
; baud (1,000,000 actual), binary output paced to 20 kB/s - the verified
; transport-loss-free setting on this bench (docs/phase3b.md).
[env:p3b_sniffer]
extends = p3b_base
build_flags = ${p3b_base.build_flags} -DOPENMOTO_SNIFFER_BENCH=0 -DOPENMOTO_SPI_HZ=4000000 -DOPENMOTO_SNIFFER_BAUD=921600 -DOPENMOTO_TX_PACE_BPS=20000
